name: Publish to npm

# Publish only after green CI on main. No workflow_dispatch — manual npm publish
# is documented as emergency fallback in docs/release/npm-publish.md.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify CI succeeded for publish commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha }}"
          RUN_ID="${{ github.event.workflow_run.id }}"
          CONCLUSION=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" --jq '.conclusion')
          if [ "$CONCLUSION" != "success" ]; then
            echo "Refusing publish: workflow_run ${RUN_ID} conclusion is ${CONCLUSION}, not success."
            exit 1
          fi
          echo "CI run ${RUN_ID} succeeded for ${SHA}; proceeding to publish."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure git for prepublish checks
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

      - name: Publish if version is new
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMSECRET }}
        run: |
          VERSION=$(node --input-type=module -e "import pkg from './package.json' with { type: 'json' }; console.log(pkg.version)")
          if npm view "pi-spine@${VERSION}" version 2>/dev/null; then
            echo "pi-spine@${VERSION} already on npm; skipping publish."
            exit 0
          fi
          npm publish --access public --ignore-scripts
