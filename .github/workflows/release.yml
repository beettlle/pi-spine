name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v1.2.3). Must already exist."
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Determine ref
        id: ref
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout at tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.tag }}

      - name: Verify CI status for tagged commit
        id: ci_gate
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.sha;
            const { data } = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: sha,
              per_page: 30,
            });
            const ciRuns = data.workflow_runs.filter((run) => run.name === "CI");
            const success = ciRuns.some((run) => run.conclusion === "success");
            const failed = ciRuns.some((run) => run.conclusion === "failure");

            if (failed && !success) {
              core.setFailed(
                `CI failed for commit ${sha}; fix CI on main before publishing this tag.`
              );
              return;
            }

            core.setOutput("passed", success ? "true" : "false");
            if (success) {
              core.info(
                `Reusing successful CI run for ${sha}; skipping duplicate validation.`
              );
            } else {
              core.info(
                `No successful CI run for ${sha}; running full release validation (lint + coverage).`
              );
            }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure git for test fixtures
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

      - name: Typecheck
        if: steps.ci_gate.outputs.passed != 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.ci_gate.outputs.passed != 'true'
        run: npm run lint

      - name: Run tests
        if: steps.ci_gate.outputs.passed != 'true'
        run: npm test

      - name: Coverage check (77% line minimum)
        if: steps.ci_gate.outputs.passed != 'true'
        run: npm run coverage:check

      - name: CLI smoke checks
        if: steps.ci_gate.outputs.passed != 'true'
        run: |
          node bin/spine.mjs version
          node bin/spine.mjs help

          # Minimal pi stub so doctor can pass without real pi credentials in CI.
          MOCK_BIN="$RUNNER_TEMP/ci-mock-bin"
          mkdir -p "$MOCK_BIN"
          cat > "$MOCK_BIN/pi" << 'EOF'
          #!/usr/bin/env bash
          case "$1" in
            --version) echo "0.78.0"; exit 0 ;;
            --list-models) printf 'provider model\nci mock-model\n'; exit 0 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x "$MOCK_BIN/pi"
          export PATH="$MOCK_BIN:$PATH"

          FIXTURE="$RUNNER_TEMP/spine-ci-fixture"
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          git init -q
          node "$GITHUB_WORKSPACE/bin/spine.mjs" init
          node "$GITHUB_WORKSPACE/bin/spine.mjs" doctor

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPMSECRET }}
        run: npm publish --access public --ignore-scripts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.ref.outputs.tag }}" \
            --title "pi-spine ${{ steps.ref.outputs.tag }}" \
            --generate-notes
