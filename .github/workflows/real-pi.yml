name: Real-pi adoption E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  real-pi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure git for fixtures
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Real-pi adoption E2E (requires pi on runner)
        env:
          SPINE_BIN: node ${{ github.workspace }}/bin/spine.mjs
        run: |
          if command -v pi >/dev/null 2>&1; then
            ./scripts/real-pi-adoption-e2e.sh --batch
          else
            echo "pi not on PATH — skipping real-pi batch (install pi for full gate)"
            ./scripts/real-pi-adoption-e2e.sh
          fi
