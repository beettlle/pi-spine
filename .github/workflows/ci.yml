name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ci:
    runs-on: ubuntu-latest
    # Timing budget (2026-07-05): npm ci ~1m; typecheck ~10s; lint ~5s; coverage:check ~8–9m
    # on ubuntu-latest (local M-series: ~134s); CLI smoke ~1m → ~11m typical. 18m ceiling.
    timeout-minutes: 18

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure git for test fixtures
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests with coverage (77% line minimum)
        run: npm run coverage:check --if-present

      # Full TAP is omitted from the job log on Actions (truncation hides failures).
      # run-coverage.mjs writes coverage-run.tap.log; upload on any outcome for triage.
      - name: Upload coverage TAP log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-run-tap
          path: coverage-run.tap.log
          if-no-files-found: warn
          retention-days: 7

      - name: CLI smoke checks
        run: |
          node bin/spine.mjs version
          node bin/spine.mjs help

          # Minimal pi stub so doctor can pass without real pi credentials in CI.
          MOCK_BIN="$RUNNER_TEMP/ci-mock-bin"
          mkdir -p "$MOCK_BIN"
          cat > "$MOCK_BIN/pi" << 'EOF'
          #!/usr/bin/env bash
          case "$1" in
            --version) echo "0.78.0"; exit 0 ;;
            --list-models) printf 'provider model\nci mock-model\n'; exit 0 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x "$MOCK_BIN/pi"
          export PATH="$MOCK_BIN:$PATH"

          FIXTURE="$RUNNER_TEMP/spine-ci-fixture"
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          git init -q
          node "$GITHUB_WORKSPACE/bin/spine.mjs" init
          node "$GITHUB_WORKSPACE/bin/spine.mjs" doctor
