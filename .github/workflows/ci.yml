name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure git for test fixtures
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test --if-present

      - name: CLI smoke checks
        run: |
          node bin/spine.mjs version
          node bin/spine.mjs help
          # doctor may exit 1 until TP-002 (no spine init in CI); non-fatal for now
          node bin/spine.mjs doctor || true
