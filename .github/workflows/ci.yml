name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure git for test fixtures
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "test@example.com"
          git config --global user.name "Test User"

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test --if-present

      - name: Coverage check (77% line minimum)
        run: npm run coverage:check --if-present

      - name: CLI smoke checks
        run: |
          node bin/spine.mjs version
          node bin/spine.mjs help

          # Minimal pi stub so doctor can pass without real pi credentials in CI.
          MOCK_BIN="$RUNNER_TEMP/ci-mock-bin"
          mkdir -p "$MOCK_BIN"
          cat > "$MOCK_BIN/pi" << 'EOF'
          #!/usr/bin/env bash
          case "$1" in
            --version) echo "0.78.0"; exit 0 ;;
            --list-models) printf 'provider model\nci mock-model\n'; exit 0 ;;
            *) exit 0 ;;
          esac
          EOF
          chmod +x "$MOCK_BIN/pi"
          export PATH="$MOCK_BIN:$PATH"

          FIXTURE="$RUNNER_TEMP/spine-ci-fixture"
          mkdir -p "$FIXTURE"
          cd "$FIXTURE"
          git init -q
          node "$GITHUB_WORKSPACE/bin/spine.mjs" init
          node "$GITHUB_WORKSPACE/bin/spine.mjs" doctor
