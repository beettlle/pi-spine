provider = "openai"
model = "qwen/qwen3-coder-next"
openai_base_url = "http://127.0.0.1:1234/v1"

num_ctx = 65536
context_limit = 65536
max_completion_tokens = 4096

timeout = "30m"
strictness = "default"
nitpicky = false
auto_finish_zero_findings = false

exclude_patterns = "*.md,*.mdc,*.txt,*.json,*.jsonc,*.toml,*.yaml,*.yml,*.lock,*.html,*.xml,*.svg,*.png,*.jpg,*.jpeg,*.gif,*.ico,*.woff,*.woff2,*.eot,*.csv,*.rst,*.adoc,*.log,*.patch,*.diff,*.gitignore,*.npmrc,*.editorconfig,*.prettierrc,*.eslintrc,*.nvmrc"
